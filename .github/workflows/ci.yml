name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check optional offline Python and SQLite workflow
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ is required'"
          python3 -m unittest tools.loglab.test_loglab -v
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve failed browser checks
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
